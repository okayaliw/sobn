<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidVault - Curated Video Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            /* Futuristic Dark Theme */
            --bg-primary: #0a0a0c;
            --bg-secondary: #141416;
            --bg-tertiary: #1f1f22;
            --bg-glass: rgba(20, 20, 22, 0.7);

            --text-primary: #f0f0f2;
            --text-secondary: #a0a0a5;
            --text-muted: #606066;

            /* Vibrant Accents */
            --accent: #ff4d4d;
            --accent-glow: rgba(255, 77, 77, 0.3);
            --accent-light: rgba(255, 77, 77, 0.15);
            --accent-dark: #cc0000;

            --border: #2a2a2e;
            --border-light: #3a3a40;

            --card-bg: #141416;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 20px var(--accent-glow);

            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        h1, h2, h3, h4 {
            font-family: 'Instrument Serif', serif;
            font-weight: 400;
            letter-spacing: -0.01em;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at top right, #1a0a0a 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #0a0a1a 0%, transparent 40%);
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card {
            background: rgba(31, 31, 34, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Header Styles */
        .header {
            padding: 0 2rem;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Instrument Serif', serif;
            font-size: 1.75rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: opacity var(--transition);
        }

        .logo:hover {
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(196, 77, 58, 0.3);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            background: rgba(255,255,255,0.03);
            padding: 0.5rem 1.5rem;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.925rem;
            font-weight: 500;
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(196, 77, 58, 0.2);
        }

        .btn-primary:hover {
            background: #ff6666;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 77, 58, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            flex: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            height: calc(100vh - 80px);
            position: sticky;
            top: 80px;
            overflow-y: auto;
            background: var(--bg-primary); /* Fallback */
            background: linear-gradient(180deg, var(--bg-primary) 0%, rgba(10,10,12,0.8) 100%);
        }

        .sidebar-section {
            margin-bottom: 2.5rem;
        }

        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            padding-left: 0.75rem;
        }

        .category-list {
            list-style: none;
        }

        .category-item {
            margin-bottom: 0.25rem;
        }

        .category-btn {
            width: 100%;
            text-align: left;
            padding: 0.75rem 0.875rem;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: inherit;
        }

        .category-btn:hover {
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
        }

        .category-btn.active {
            background: linear-gradient(90deg, rgba(255,77,77,0.1) 0%, transparent 100%);
            color: var(--accent);
            border-left: 2px solid var(--accent);
            border-radius: 4px 12px 12px 4px;
        }

        .category-icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            filter: grayscale(0.5);
            transition: var(--transition);
        }

        .category-btn:hover .category-icon,
        .category-btn.active .category-icon {
            filter: grayscale(0);
            transform: scale(1.1);
        }

        .subcategory-list {
            list-style: none;
            margin-left: 1rem;
            margin-top: 0.25rem;
            border-left: 1px solid var(--border);
            padding-left: 0.75rem;
        }

        .subcategory-btn {
            width: 100%;
            text-align: left;
            padding: 0.5rem 0.75rem;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            position: relative;
        }

        .subcategory-btn:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
        }

        .subcategory-btn.active {
            color: var(--accent);
            font-weight: 500;
        }

        .subcategory-btn.active::before {
            content: '•';
            color: var(--accent);
            position: absolute;
            left: -1.05rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            height: 400px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: flex-end;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 10s ease;
        }

        .hero-section:hover .hero-bg {
            transform: scale(1.05);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #0a0a0c 0%, rgba(10,10,12,0.6) 50%, transparent 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 3rem;
            max-width: 800px;
            animation: slideUp 0.8s ease-out;
        }

        .hero-badge {
            display: inline-block;
            padding: 0.35rem 0.75rem;
            background: var(--accent);
            color: white;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            box-shadow: 0 4px 10px rgba(196, 77, 58, 0.4);
        }

        .hero-title {
            font-size: 3rem;
            color: white;
            line-height: 1.1;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255,255,255,0.8);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .hero-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: #fbbf24;
            font-weight: 600;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all var(--transition);
            cursor: pointer;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.15);
        }

        .video-card:hover .video-thumbnail img {
            transform: scale(1.05);
        }

        .video-thumbnail {
            position: relative;
            aspect-ratio: 16/9;
            background: var(--bg-tertiary);
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-card:hover .video-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .video-card:hover .play-icon {
            transform: scale(1);
        }

        .video-duration {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .video-info {
            padding: 1.25rem;
        }

        .video-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .video-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.825rem;
            margin-top: 0.75rem;
        }

        .video-channel {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .video-rating {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            background: rgba(255, 77, 77, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.625rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .video-category-tag {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            padding: 0.35rem 0.75rem;
            background: rgba(20, 20, 22, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 100px;
            font-size: 0.7rem;
            color: white;
            font-weight: 500;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .modal-lg {
            max-width: 1100px;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.5rem;
            color: var(--text-primary);
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all var(--transition);
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
            color: white;
            border-color: var(--text-muted);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 2rem;
        }

        /* Rating Component */
        .rating-slider {
            margin: 2rem 0;
            padding: 1.5rem;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .rating-value {
            text-align: center;
            font-size: 3.5rem;
            font-family: 'Instrument Serif', serif;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(196, 77, 58, 0.3);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: var(--bg-tertiary);
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent);
            transition: all var(--transition);
            border: 2px solid #fff;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #fff;
        }

        /* Video Detail View */
        .video-detail {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2.5rem;
        }

        .video-player-container {
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-detail-info {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 2rem;
            height: fit-content;
            border: 1px solid var(--border);
        }

        .video-detail-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.3;
            color: var(--text-primary);
        }

        /* Form Controls */
        .form-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.875rem 1rem;
            border-radius: 10px;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(196, 77, 58, 0.2);
            background: var(--bg-secondary);
        }

        .tag {
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        /* Admin/Table */
        .admin-nav-item.active {
            background: var(--accent-light);
            color: var(--accent);
            border-left: 2px solid var(--accent);
            border-radius: 0 8px 8px 0;
        }

        .data-table th {
            background: var(--bg-tertiary);
            color: var(--text-muted);
        }

        .data-table td {
            border-bottom-color: var(--border);
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .video-detail {
                grid-template-columns: 1fr;
            }
            .hero-section {
                height: 300px;
            }
            .hero-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                padding: 1.5rem;
            }
            .header {
                padding: 0 1.5rem;
                height: 70px;
            }
            .nav-links {
                display: none;
            }
            .hero-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useCallback } = React;

        // ==================== DATA & CONSTANTS ====================

            const [user, setUser] = useState(null);
            const [videos, setVideos] = useState(SAMPLE_VIDEOS);
            const [userRatings, setUserRatings] = useState({});
            const [seenVideos, setSeenVideos] = useState(new Set());
            const [toast, setToast] = useState(null);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const login = (userData) => {
                setUser(userData);
                showToast('Welcome back!');
            };

            const logout = () => {
                setUser(null);
                setUserRatings({});
                showToast('Logged out successfully');
            };

            const addVideo = (video) => {
                const newVideo = {
                    ...video,
                    id: Date.now().toString(),
                    avgRating: 0,
                    ratingCount: 0,
                    addedAt: new Date()
                };
                setVideos(prev => [newVideo, ...prev]);
                showToast('Video added successfully!');
            };

            const rateVideo = (videoId, rating) => {
                setUserRatings(prev => ({ ...prev, [videoId]: rating }));

                setVideos(prev => prev.map(video => {
                    if (video.id === videoId) {
                        const wasRated = userRatings[videoId] !== undefined;
                        const oldRating = userRatings[videoId] || 0;
                        const newCount = wasRated ? video.ratingCount : video.ratingCount + 1;
                        const newAvg = wasRated
                            ? (video.avgRating * video.ratingCount - oldRating + rating) / video.ratingCount
                            : (video.avgRating * video.ratingCount + rating) / newCount;

                        return {
                            ...video,
                            avgRating: Math.round(newAvg * 10) / 10,
                            ratingCount: newCount
                        };
                    }
                    return video;
                }));

                showToast('Rating saved!');
            };

            const markAsSeen = (videoId) => {
                setSeenVideos(prev => new Set([...prev, videoId]));
            };

            // Discovery Algorithm
            const getDiscoveryVideos = useCallback((category = null, subcategory = null, refreshSeed = 0) => {
                let filtered = [...videos];

                // Filter by category/subcategory
                if (category) {
                    filtered = filtered.filter(v => v.category === category);
                }
                if (subcategory) {
                    filtered = filtered.filter(v => v.subcategory === subcategory);
                }

                // Suppress seen videos (with decay)
                filtered = filtered.map(video => ({
                    ...video,
                    seenPenalty: seenVideos.has(video.id) ? 0.3 : 1
                }));

                // Score videos
                filtered = filtered.map(video => {
                    const freshness = 1 / (1 + (Date.now() - new Date(video.addedAt).getTime()) / (1000 * 60 * 60 * 24 * 7));
                    const quality = video.avgRating / 10;
                    const popularity = Math.min(video.ratingCount / 100, 1) * 0.3;
                    const randomFactor = (Math.sin(video.id.charCodeAt(0) + refreshSeed) + 1) / 2 * 0.2;

                    return {
                        ...video,
                        score: (freshness * 0.25 + quality * 0.4 + popularity * 0.15 + randomFactor) * video.seenPenalty
                    };
                });

                // Sort by score with controlled randomness
                filtered.sort((a, b) => b.score - a.score);

                return filtered;
            }, [videos, seenVideos]);

            return (
                <AppContext.Provider value={{
                    user, login, logout,
                    videos, addVideo,
                    userRatings, rateVideo,

                        </span>
                        <span
                            className={`admin-nav-item ${activeTab === 'videos' ? 'active' : ''}`}
                            onClick={() => setActiveTab('videos')}
                        >
                            Videos
                        </span>
                        <span
                            className={`admin-nav-item ${activeTab === 'categories' ? 'active' : ''}`}
                            onClick={() => setActiveTab('categories')}
                        >
                            Categories
                        </span>
                        <span
                            className={`admin-nav-item ${activeTab === 'algorithm' ? 'active' : ''}`}
                            onClick={() => setActiveTab('algorithm')}
                        >
                            Algorithm
                        </span>
                    </nav>

                    <div className="admin-content">
                        {activeTab === 'overview' && (
                            <>
                                <h3 className="admin-section-title">Platform Overview</h3>
                                <div className="stats-grid">
                                    <div className="stat-card">
                                        <div className="stat-value">{stats.totalVideos}</div>
                                        <div className="stat-label">Total Videos</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value">{stats.totalRatings}</div>
                                        <div className="stat-label">Total Ratings</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-value">{stats.avgRating}</div>
                                        <div className="stat-label">Avg Rating</div>
                                    </div>
                                </div>
                                <div style={{ background: 'rgba(255,255,255,0.02)', padding: '1rem', borderRadius: '12px' }}>
                                    Chart placeholder
                                </div>
                            </>
                        )}
                        {/* Simplified for brevity in this update */}
                    </div>
                </div>
            );
        };

        // Discover Page
        const DiscoverPage = ({ onVideoClick }) => {
            const { getDiscoveryVideos, seenVideos } = useContext(AppContext);
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [selectedSubcategory, setSelectedSubcategory] = useState(null);
            const [refreshSeed, setRefreshSeed] = useState(0);

            const videos = getDiscoveryVideos(selectedCategory, selectedSubcategory, refreshSeed);
            const category = CATEGORIES.find(c => c.id === selectedCategory);

            // Featured Video (highest rated unseen)
            const featuredVideo = videos[0];
            const listVideos = videos.slice(1);

            const handleRefresh = () => {
                setRefreshSeed(prev => prev + 1);
            };

            return (
                <div className="main-layout">
                    <Sidebar
                        selectedCategory={selectedCategory}
                        selectedSubcategory={selectedSubcategory}
                        onSelectCategory={setSelectedCategory}
                        onSelectSubcategory={setSelectedSubcategory}
                    />
                    <main className="main-content">
                        <div className="page-header">
                            <div>
                                <h1 className="page-title">
                                    {selectedSubcategory || (category ? category.name : 'Discover')}
                                </h1>
                                <p className="page-subtitle">
                                    {selectedCategory
                                        ? `Curated ${category?.name.toLowerCase()} content for you`
                                        : 'Fresh picks for your mind'}
                                </p>
                            </div>
                            <button className="refresh-btn" onClick={handleRefresh}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                    <path d="M23 4v6h-6M1 20v-6h6"/>
                                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                                </svg>
                                Shuffle
                            </button>
                        </div>

                        {!selectedCategory && !selectedSubcategory && (
                            <HeroSection video={featuredVideo} onClick={onVideoClick} />
                        )}

                        <VideoGrid videos={selectedCategory ? videos : listVideos} onVideoClick={onVideoClick} />
                    </main>
                </div>
            );
        };

        // Main App
        const App = () => {
            const [currentPage, setCurrentPage] = useState('discover');
            const [authModal, setAuthModal] = useState(null);
            const [addVideoModal, setAddVideoModal] = useState(false);
            const [selectedVideo, setSelectedVideo] = useState(null);
            const { toast, user } = useContext(AppContext);

            const handleNavigate = (page) => {
                if (page === 'add') {
                    if (user) {
                        setAddVideoModal(true);
                    } else {
                        setAuthModal('login');
                    }
                } else {
                    setCurrentPage(page);
                }
            };

            return (
                <div className="app-container">
                    <Header
                        onNavigate={handleNavigate}
                        currentPage={currentPage}
                        onAuthClick={setAuthModal}
                    />

                    {currentPage === 'discover' && (
                        <DiscoverPage onVideoClick={setSelectedVideo} />
                    )}

                    {currentPage === 'admin' && user?.isAdmin && (
                        <main className="main-content" style={{ maxWidth: '1400px', margin: '0 auto' }}>
                            <div className="page-header">
                                <h1 className="page-title">Admin Dashboard</h1>
                                <p className="page-subtitle">Platform Management</p>
                            </div>
                            <AdminPanel />
                        </main>
                    )}

                    {authModal && (
                        <AuthModal
                            mode={authModal}
                            onClose={() => setAuthModal(null)}
                        />
                    )}

                    {addVideoModal && (
                        <AddVideoModal onClose={() => setAddVideoModal(false)} />
                    )}

                    {selectedVideo && (
                        <VideoDetailModal
                            video={selectedVideo}
                            onClose={() => setSelectedVideo(null)}
                        />
                    )}

                    {toast && <div className="toast">{toast}</div>}
                </div>
            );
        };

        // Mount
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );
    </script>
</body>
</html>
